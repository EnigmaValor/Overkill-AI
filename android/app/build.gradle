apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'ai.overkill.privacyguard'
    compileSdk 34

    defaultConfig {
        applicationId "ai.overkill.privacyguard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // The app is DEX-only (no native libs) but is built and documented for
        // arm64-v8a devices such as the Pixel 7 Pro; keep the ABI filter so
        // builds stay consistent on all toolchains.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('PG_KEYSTORE_FILE')) {
                signingConfig signingConfigs.create('release') {
                    storeFile file(project.property('PG_KEYSTORE_FILE'))
                    storePassword project.property('PG_KEYSTORE_PASSWORD')
                    keyAlias project.property('PG_KEY_ALIAS')
                    keyPassword project.property('PG_KEY_PASSWORD')
                }
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

// Bundle the built React UI (repo root ../dist) into assets/www.
def webDistDir = file("${rootProject.projectDir}/../dist")
def webTargetDir = file("${projectDir}/src/main/assets/www")

tasks.register('syncWebAssets', Sync) {
    from webDistDir
    into webTargetDir
    include 'index.html'
    include 'assets/**'
    inputs.dir webDistDir
    outputs.dir webTargetDir
}

preBuild.dependsOn 'syncWebAssets'

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
